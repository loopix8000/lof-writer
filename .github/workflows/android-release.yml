name: Build Android APK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed APK release and matching Android update channels
        type: boolean
        default: false
      show_update_notice:
        description: Show the update completion popup on first launch after updating
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64-release
          cache-on-failure: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NDK_HOME=$env:ANDROID_HOME\ndk\30.0.16248370" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build ARM64 release APK
        env:
          VITE_SHOW_UPDATE_NOTICE: ${{ inputs.show_update_notice }}
        run: npm run android:build -- --release --target=aarch64
      - name: Sign and verify APK
        id: apk
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/sign-android-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            release/*.apk
            release/*.apk.sha256
            release/android-latest.json
      - name: Publish Android release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-android-release.mjs
