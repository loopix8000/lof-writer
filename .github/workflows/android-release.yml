name: Build Android APK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed APK release and Android beta channel
        type: boolean
        default: false
      show_update_notice:
        description: Show the update completion popup on first launch after updating
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64-release
          cache-on-failure: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NDK_HOME=$env:ANDROID_HOME\ndk\30.0.16248370" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build ARM64 release APK
        env:
          VITE_SHOW_UPDATE_NOTICE: ${{ inputs.show_update_notice }}
        run: npm run android:build -- --release --target=aarch64
      - name: Sign and verify APK
        id: apk
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/sign-android-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            release/*.apk
            release/*.apk.sha256
            release/android-latest.json
      - name: Publish Android release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.apk.outputs.version }}
          APK_ASSET: ${{ steps.apk.outputs.asset }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag "release/$env:APK_ASSET" "release/$env:APK_ASSET.sha256" release/android-latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Lof Writer Android $tag" --notes-file ANDROID_RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 앱은 android-beta 채널을 확인한다. 0.0.2 알파 버전까지 설치한 앱은 android-alpha 채널을 확인하므로
          # 두 채널에 같은 배포 정보를 올려 기존 알파 사용자도 베타로 업데이트되게 한다.
          $channelDir = Join-Path $env:RUNNER_TEMP 'android-channel'
          New-Item -ItemType Directory -Force -Path $channelDir | Out-Null
          Copy-Item -LiteralPath release/android-latest.json -Destination (Join-Path $channelDir 'latest.json')
          $channels = @(
            @{ Tag = 'android-beta'; Title = 'Android beta update channel'; Notes = 'Android 베타 버전의 배포 정보를 제공합니다. APK는 버전별 릴리즈에서 다운로드하세요.' },
            @{ Tag = 'android-alpha'; Title = 'Android alpha update channel'; Notes = 'Android 알파 버전의 배포 정보를 제공합니다. APK는 버전별 릴리즈에서 다운로드하세요.' }
          )
          foreach ($channel in $channels) {
            gh release view $channel.Tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $channel.Tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title $channel.Title --notes $channel.Notes
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            gh release upload $channel.Tag (Join-Path $channelDir 'latest.json') --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $channel.Tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
