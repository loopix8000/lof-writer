name: Build Windows MSI release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release and update the beta channel after building
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-msi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Prepare updater configuration
        id: updater
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          SIGNING_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          if ($env:SIGNING_KEY_PRESENT -ne 'true') { throw 'TAURI_SIGNING_PRIVATE_KEY secret is required.' }
          npm run updater:prepare
      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Lof Writer v__VERSION__
          releaseBody: Windows MSI 설치 파일과 업데이트 정보를 포함합니다.
          releaseDraft: true
          prerelease: ${{ steps.updater.outputs.prerelease == 'true' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: false
          args: --bundles msi --config src-tauri/tauri.updater.generated.json
      - name: Publish release and update channel
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
